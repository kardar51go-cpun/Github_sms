<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎮 استور — اپلیکیشن و بازی</title>
<style>
  :root{
    --bg:#0a0d18; --panel:#141828; --panel2:#1c2136;
    --text:#e8eaf6; --muted:#8b91aa;
    --accent:#7c5cff; --accent2:#a78bfa;
    --green:#3ddc97; --yellow:#ffc857;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);
    background-image:radial-gradient(1200px 600px at 100% -10%,rgba(124,92,255,.15),transparent),
                     radial-gradient(900px 500px at -10% 10%,rgba(61,220,151,.08),transparent)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);
    background:rgba(10,13,24,.75);border-bottom:1px solid rgba(255,255,255,.06)}
  .header-inner{max-width:1200px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
  .logo-icon{width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:18px}
  .search-box{flex:1;min-width:200px;position:relative}
  .search-box input{width:100%;background:var(--panel2);border:1px solid rgba(255,255,255,.06);
    border-radius:12px;padding:11px 16px 11px 40px;color:var(--text);font-size:14px;outline:none;
    transition:.2s}
  .search-box input:focus{border-color:var(--accent);background:#222741}
  .search-box::before{content:"🔍";position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.6;pointer-events:none}

  /* main */
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}

  /* category chips */
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:10px;
    scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{white-space:nowrap;padding:8px 16px;border-radius:100px;
    background:var(--panel2);border:1px solid rgba(255,255,255,.06);
    font-size:13px;color:var(--muted);transition:.2s;cursor:pointer}
  .cat:hover{color:var(--text)}
  .cat.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border-color:transparent;font-weight:600}

  /* section title */
  .section-title{font-size:16px;font-weight:700;margin:22px 0 14px;display:flex;
    align-items:center;gap:8px}
  .section-title::before{content:"";width:4px;height:18px;border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent2))}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  @media (max-width:480px){ .grid{grid-template-columns:repeat(2,1fr);gap:10px} }

  /* card */
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:16px;
    padding:14px;text-align:center;cursor:pointer;transition:.25s cubic-bezier(.2,.9,.3,1.2);
    position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:rgba(124,92,255,.4);
    box-shadow:0 12px 30px -10px rgba(124,92,255,.4)}
  .card::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(135deg,rgba(124,92,255,.08),transparent);opacity:0;transition:.25s}
  .card:hover::after{opacity:1}

  .icon{width:72px;height:72px;border-radius:18px;margin:4px auto 12px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800;color:#fff;overflow:hidden;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.6);position:relative;z-index:1}
  .icon img{width:100%;height:100%;object-fit:cover}
  .card-title{font-size:14px;font-weight:600;margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-cat{font-size:11px;color:var(--muted);margin-bottom:6px}
  .card-rating{font-size:12px;color:var(--yellow);display:inline-flex;
    align-items:center;gap:3px}
  .badge-feat{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#ff6b6b,#ff8e53);
    color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;
    letter-spacing:.5px;z-index:2}

  /* empty */
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .empty .big{font-size:48px;margin-bottom:12px;opacity:.4}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(5,7,15,.9);backdrop-filter:blur(8px);
    z-index:100;display:none;align-items:flex-start;justify-content:center;
    padding:20px;overflow-y:auto}
  .modal.open{display:flex;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-inner{width:100%;max-width:1000px;background:var(--panel);border-radius:20px;
    overflow:hidden;border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7);margin:auto;animation:slideUp .3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

  .modal-head{padding:20px;display:flex;gap:14px;align-items:flex-start;
    border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
  .modal-head .icon{width:72px;height:72px;margin:0;flex-shrink:0}
  .modal-head-info{flex:1;min-width:0}
  .modal-head-info h2{font-size:20px;margin-bottom:6px;font-weight:700}
  .modal-head-info .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .modal-head-info .meta .cat-badge{background:rgba(124,92,255,.2);color:var(--accent2);
    padding:2px 8px;border-radius:6px;font-weight:600}
  .close-btn{background:rgba(255,255,255,.06);width:36px;height:36px;border-radius:10px;
    font-size:22px;line-height:1;color:var(--text);display:flex;
    align-items:center;justify-content:center;transition:.2s}
  .close-btn:hover{background:rgba(255,92,122,.2);color:#ff5c7a}

  .modal-body{padding:0}
  .app-frame{width:100%;height:min(70vh,600px);background:#000;border:0;display:block}
  .modal-desc{padding:18px 20px;font-size:14px;line-height:1.9;color:var(--muted);
    border-top:1px solid rgba(255,255,255,.06)}
  .modal-desc b{color:var(--text);display:block;margin-bottom:4px;font-size:13px}

  .action-btn{padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:.2s;text-decoration:none}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid rgba(255,255,255,.08)}
  .btn-secondary:hover{background:#252b45}

  .modal-actions{padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;
    border-top:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🎮</div>
      <span>استور</span>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="جستجو در اپ‌ها و بازی‌ها…">
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>

  <div id="featuredSection" style="display:none">
    <div class="section-title">⭐ ویژه</div>
    <div class="grid" id="featuredGrid"></div>
  </div>

  <div class="section-title" id="allTitle">همه اپ‌ها</div>
  <div class="grid" id="appsGrid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">📭</div>
    <div>چیزی پیدا نشد</div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-head">
      <div class="icon" id="mIcon"></div>
      <div class="modal-head-info">
        <h2 id="mTitle"></h2>
        <div class="meta" id="mMeta"></div>
      </div>
      <button class="close-btn" id="closeModal">×</button>
    </div>
    <div class="modal-body">
      <iframe class="app-frame" id="mFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
    <div class="modal-actions">
      <a class="action-btn btn-primary" id="mOpenNew" target="_blank" rel="noopener">🚀 باز کردن در تب جدید</a>
      <button class="action-btn btn-secondary" id="mReload">🔄 بارگذاری مجدد</button>
    </div>
    <div class="modal-desc" id="mDesc"></div>
  </div>
</div>

<script>
const state = { apps: [], filter: 'همه', query: '' };

const COLORS = [
  'linear-gradient(135deg,#7c5cff,#a78bfa)',
  'linear-gradient(135deg,#ff6b6b,#ff8e53)',
  'linear-gradient(135deg,#3ddc97,#38bdf8)',
  'linear-gradient(135deg,#fbbf24,#f97316)',
  'linear-gradient(135deg,#ec4899,#a855f7)',
  'linear-gradient(135deg,#06b6d4,#3b82f6)',
  'linear-gradient(135deg,#84cc16,#22c55e)',
];

function esc(s){ return String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function colorFor(str){
  let h = 0; for (const c of (str || '')) h = (h * 31 + c.charCodeAt(0)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

function iconHTML(app){
  if (app.icon){
    return `<div class="icon"><img src="${esc(app.icon)}" alt=""
      onerror="this.parentNode.style.background='${colorFor(app.title)}';this.parentNode.textContent='${esc((app.title||'?')[0])}'"></div>`;
  }
  return `<div class="icon" style="background:${colorFor(app.title)}">${esc((app.title||'?')[0])}</div>`;
}

function renderCats(){
  const cats = ['همه', ...new Set(state.apps.map(a => a.category).filter(Boolean))];
  const el = document.getElementById('cats');
  el.innerHTML = cats.map(c => 
    `<button class="cat ${state.filter === c ? 'active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join('');
  el.querySelectorAll('.cat').forEach(b => {
    b.onclick = () => { state.filter = b.dataset.cat; renderCats(); renderApps(); };
  });
}

function cardHTML(app){
  return `<div class="card" data-title="${esc(app.title)}">
    ${app.featured ? '<div class="badge-feat">ویژه</div>' : ''}
    ${iconHTML(app)}
    <div class="card-title">${esc(app.title)}</div>
    <div class="card-cat">${esc(app.category || 'دسته‌بندی نشده')}</div>
    ${app.rating ? `<div class="card-rating">★ ${Number(app.rating).toFixed(1)}</div>` : ''}
  </div>`;
}

function renderApps(){
  const all = state.apps;
  const filtered = all.filter(a => {
    if (state.filter !== 'همه' && a.category !== state.filter) return false;
    if (state.query){
      const q = state.query.toLowerCase();
      return (a.title||'').toLowerCase().includes(q) || 
             (a.description||'').toLowerCase().includes(q) ||
             (a.category||'').toLowerCase().includes(q);
    }
    return true;
  });

  // Featured
  const featured = filtered.filter(a => a.featured);
  const fsec = document.getElementById('featuredSection');
  const fgrid = document.getElementById('featuredGrid');
  if (featured.length && !state.query && state.filter === 'همه'){
    fsec.style.display = 'block';
    fgrid.innerHTML = featured.map(cardHTML).join('');
    fgrid.querySelectorAll('.card').forEach(c => c.onclick = () => openApp(c.dataset.title));
  } else {
    fsec.style.display = 'none';
  }

  // All (exclude featured when showing featured)
  const showFeatured = featured.length && !state.query && state.filter === 'همه';
  const rest = showFeatured ? filtered.filter(a => !a.featured) : filtered;
  
  document.getElementById('allTitle').textContent = 
    showFeatured ? 'همه اپ‌ها' : (state.query ? `نتایج جستجو (${filtered.length})` : 'همه اپ‌ها');

  const grid = document.getElementById('appsGrid');
  const empty = document.getElementById('empty');
  if (rest.length === 0 && !(showFeatured && featured.length)){
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    grid.innerHTML = rest.map(cardHTML).join('');
    empty.style.display = 'none';
    grid.querySelectorAll('.card').forEach(c => c.onclick = () => openApp(c.dataset.title));
  }
}

function openApp(title){
  const app = state.apps.find(a => a.title === title);
  if (!app) return;
  document.getElementById('mIcon').outerHTML = iconHTML(app).replace('class="icon"', 'class="icon" id="mIcon"');
  document.getElementById('mTitle').textContent = app.title;
  document.getElementById('mMeta').innerHTML = 
    (app.category ? `<span class="cat-badge">${esc(app.category)}</span>` : '') +
    (app.rating ? `<span>★ ${Number(app.rating).toFixed(1)}</span>` : '');
  document.getElementById('mFrame').src = app.url;
  document.getElementById('mOpenNew').href = app.url;
  document.getElementById('mDesc').innerHTML = app.description 
    ? `<b>درباره</b>${esc(app.description)}` : '';
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('mFrame').src = 'about:blank';
}

document.getElementById('closeModal').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e => { 
  if (e.target.id === 'modal') closeModal(); 
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('mReload').onclick = () => {
  const f = document.getElementById('mFrame');
  f.src = f.src;
};

document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value.trim();
  renderApps();
});

(async () => {
  try {
    const res = await fetch('apps.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok){
      const data = await res.json();
      state.apps = Array.isArray(data) ? data : (data.apps || []);
    }
  } catch(e){}
  renderCats();
  renderApps();
})();
</script>
</body>
</html>
